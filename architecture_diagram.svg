<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PhishingHunter v2 architecture</title>
<desc>Data flow from browser through Flask routes into three parallel detection modules, merged by a scoring engine, and stored in SQLite, with a feedback path back to the app for stats and history.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f7d8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="540" fill="#0b0f14"/>

<style>
  .box{fill:#111826;stroke:#3a4656;stroke-width:1;}
  .boxP{fill:#1c1430;stroke:#7f5fd9;stroke-width:1;}
  .th{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#e7edf3;}
  .ts{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#9fb0bd;}
  .thP{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#e6def8;}
  .tsP{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#bda9f2;}
  .arr{stroke:#5f7d8a;stroke-width:1;fill:none;}
</style>

<g>
<rect class="box" x="230" y="40" width="220" height="44" rx="8"/>
<text class="th" x="340" y="58" text-anchor="middle">Browser</text>
<text class="ts" x="340" y="75" text-anchor="middle">Paste link, see results</text>
</g>
<line x1="340" y1="84" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>

<g>
<rect class="box" x="190" y="110" width="300" height="56" rx="8"/>
<text class="th" x="340" y="132" text-anchor="middle">Flask app · app.py</text>
<text class="ts" x="340" y="150" text-anchor="middle">/hunt /stats /history routes</text>
</g>

<line x1="340" y1="166" x2="340" y2="196" class="arr"/>
<line x1="120" y1="196" x2="520" y2="196" class="arr"/>
<line x1="120" y1="196" x2="120" y2="208" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="196" x2="320" y2="208" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="196" x2="520" y2="208" class="arr" marker-end="url(#arrow)"/>

<g>
<rect class="boxP" x="30" y="210" width="180" height="56" rx="8"/>
<text class="thP" x="120" y="232" text-anchor="middle">Structure &amp; domain</text>
<text class="tsP" x="120" y="250" text-anchor="middle">Typosquat &amp; homoglyph</text>
</g>
<g>
<rect class="boxP" x="230" y="210" width="180" height="56" rx="8"/>
<text class="thP" x="320" y="232" text-anchor="middle">Live network checks</text>
<text class="tsP" x="320" y="250" text-anchor="middle">WHOIS, TLS, redirects</text>
</g>
<g>
<rect class="boxP" x="430" y="210" width="180" height="56" rx="8"/>
<text class="thP" x="520" y="232" text-anchor="middle">Blocklist lookup</text>
<text class="tsP" x="520" y="250" text-anchor="middle">OpenPhish + URLhaus</text>
</g>

<line x1="120" y1="266" x2="120" y2="296" class="arr"/>
<line x1="320" y1="266" x2="320" y2="296" class="arr"/>
<line x1="520" y1="266" x2="520" y2="296" class="arr"/>
<line x1="120" y1="296" x2="520" y2="296" class="arr"/>
<line x1="340" y1="296" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>

<g>
<rect class="box" x="190" y="320" width="300" height="56" rx="8"/>
<text class="th" x="340" y="342" text-anchor="middle">Scoring engine</text>
<text class="ts" x="340" y="360" text-anchor="middle">detector.py, explainable signals</text>
</g>

<line x1="340" y1="376" x2="340" y2="418" class="arr" marker-end="url(#arrow)"/>

<g>
<rect class="box" x="190" y="420" width="300" height="56" rx="8"/>
<text class="th" x="340" y="442" text-anchor="middle">SQLite database</text>
<text class="ts" x="340" y="460" text-anchor="middle">Scan history, cache, feedback</text>
</g>

<path d="M490 448 H630 V138 H492" fill="none" stroke="#5f7d8a" stroke-width="1" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#arrow)"/>
<text class="ts" x="634" y="293" transform="rotate(90 634 293)" text-anchor="middle" opacity="0.8">stats / history feedback</text>

<circle cx="46" cy="500" r="5" fill="#7f5fd9"/>
<text class="ts" x="58" y="504">Purple = the three parallel detection modules</text>
</svg>
