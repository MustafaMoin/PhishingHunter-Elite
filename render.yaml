services:
  - type: web
    name: phishinghunter-elite
    env: python
    region: singapore
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: phishinghunter
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PHISHINGHUNTER_SECRET
        generateValue: true
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
    healthCheckPath: /health
